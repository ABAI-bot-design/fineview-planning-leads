name: Weekly planning scrape

on:
  # No cron here: GitHub's scheduler ran up to 7h late or not at all. A Claude scheduled
  # task starts this every Monday ~07:56 UK time, watches it and reports the results.
  workflow_dispatch:         # manual "Run workflow" button (also used by the Monday task)
    inputs:
      lookback_days:
        description: "Days of decisions to fetch (8 = weekly, 90 = backfill)"
        default: "8"
      mode:
        description: "scrape = fetch new applications; rescore = re-check saved ones; enrich = fill websites/socials for saved businesses"
        type: choice
        options: [scrape, rescore, enrich]
        default: scrape
      councils:
        description: "Only these councils, comma-separated (blank = all), e.g. Barnet"
        default: ""

# never run two scrapes at once (a second one waits for the first)
concurrency:
  group: planning-scrape
  cancel-in-progress: false

jobs:
  scrape:
    # Runs on Aston's Mac (UK IP) - councils block overseas cloud runners.
    # If the Mac is off, the job queues and runs when it's next online (up to 24h).
    runs-on: self-hosted
    timeout-minutes: 480   # 90-day backfill can take hours
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python env
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      # caffeinate stops the Mac idle-sleeping mid-run (sleep killed run #39039843131)
      - run: caffeinate -dimsu .venv/bin/python src/main.py
        env:
          LOOKBACK_DAYS: ${{ inputs.lookback_days }}
          MODE: ${{ inputs.mode }}
          COUNCILS: ${{ inputs.councils }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
