name: Daily planning scrape

on:
  schedule:
    - cron: "17 11 * * *"   # 11:17 UTC (midday UK) - laptop is usually on
  workflow_dispatch: {}      # manual "Run workflow" button

jobs:
  scrape:
    # Runs on Aston's Mac (UK IP) - councils block overseas cloud runners.
    # If the Mac is off, the job queues and runs when it's next online (up to 24h).
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python env
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -q -r requirements.txt
      - run: .venv/bin/python src/main.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          COMPANIES_HOUSE_API_KEY: ${{ secrets.COMPANIES_HOUSE_API_KEY }}
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
