# Councils within ~10 miles of Radlett (WD7).
# All listed as Idox Public Access portals. Base URLs must be verified on first live run;
# set enabled: false for any that fail until a custom adapter is written.
councils:
  - name: Hertsmere
    base_url: https://www6.hertsmere.gov.uk/online-applications
    enabled: true
  - name: St Albans
    # new Idox system for applications logged from 8 Oct 2026 (old system kept for earlier ones)
    base_url: https://pa.stalbans.gov.uk/online-applications
    enabled: true
  - name: Watford
    base_url: https://pa.watford.gov.uk/publicaccess
    enabled: true
  - name: Three Rivers
    base_url: https://www3.threerivers.gov.uk/online-applications
    enabled: true
  - name: Welwyn Hatfield
    base_url: https://planning.welhat.gov.uk/Search/Advanced
    enabled: false   # custom (non-Idox) portal - needs its own adapter
  - name: Barnet
    base_url: https://publicaccess.barnet.gov.uk/online-applications
    enabled: true
    # Barnet returns 429 "Too Many Requests" at the default pace and then blocks for
    # long spells: go slow, rest between searches, and stop for the week if it keeps
    # refusing (saved jobs are kept; the next run carries on where this one stopped)
    delay: 12
    pause_between_searches: 120
  - name: Harrow
    base_url: https://planningsearch.harrow.gov.uk/planning/index.html?fa=search
    enabled: false   # custom (non-Idox) portal - needs its own adapter

# How far back each run looks (runs weekly; 8 days gives 1 day overlap)
lookback_days: 8
